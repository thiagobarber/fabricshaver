<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Language</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* Fundo Dinâmico com Efeito Blur */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(8px) brightness(0.6);
            transform: scale(1.05); /* Evita bordas brancas pelo blur */
        }

        .bg-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Overlay Escuro */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Estrutura do Modal */
        .modal {
            position: relative;
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 32px 24px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Botão Fechar (X) */
        .btn-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* Tipografia */
        .modal-icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }

        /* Botões de Seleção */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Destaque para o Inglês (Principal) */
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            border: 2px solid #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-1px);
        }

        /* Opções Secundárias */
        .btn-secondary {
            background: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .flag-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag {
            font-size: 20px;
        }

        .badge-recommended {
            background: #dbeafe;
            color: #1e40af;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .arrow {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Rodapé de Segurança */
        .modal-footer {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- Fundo Carregando a Página de Destino Desfocada -->
    <div class="bg-container">
        <iframe src="https://www.clickrtrckr.com/HJ1796W/92G12P3/" tabindex="-1" aria-hidden="true"></iframe>
    </div>

    <!-- Overlay & Modal -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <!-- Botão de Fechar Direcionando ao Link -->
            <a href="https://www.clickrtrckr.com/HJ1796W/92G12P3/" class="btn-close" title="Close">✕</a>

            <div class="modal-icon">🌐</div>
            <h2>Select Your Language</h2>
            <p>Please choose your preferred language to continue</p>

            <div class="btn-group">
                <!-- Opção 1: Inglês (Destaque Principal) -->
                <a href="https://www.clickrtrckr.com/HJ1796W/92G12P3/" class="btn-option btn-primary">
                    <div class="flag-text">
                        <span class="flag">🇺🇸</span>
                        <span>English</span>
                    </div>
                    <span class="badge-recommended">Default</span>
                </a>

                <!-- Opção 2: Espanhol -->
                <a href="https://www.clickrtrckr.com/HJ1796W/92G12P3/" class="btn-option btn-secondary">
                    <div class="flag-text">
                        <span class="flag">🇪🇸</span>
                        <span>Español</span>
                    </div>
                    <span class="arrow">➔</span>

                <!-- Opção 3: Outros -->
                <a href="https://www.clickrtrckr.com/HJ1796W/92G12P3/" class="btn-option btn-secondary">
                    <div class="flag-text">
                        <span class="flag">🌍</span>

                    <span class="arrow">➔</span>
                </a>
            </div>

            <div class="modal-footer">
                <span>🔒 Secure Connection & Fast Redirection</span>
            </div>
        </div>
    </div>

  <script defer src="https://presellfuga.lovable.app/tracker.js?site=6dfa8a6b-050f-41ae-822a-f879846a55d4"></script>
</body>
</html>
